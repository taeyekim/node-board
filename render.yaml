services:
  - type: web
    name: node-board-api
    env: node
    rootDir: apps/server
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm run prisma:deploy && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN
        sync: false
      - key: CACHE_TTL_SECONDS
        value: 30
      - key: REDIS_URL
        sync: false
